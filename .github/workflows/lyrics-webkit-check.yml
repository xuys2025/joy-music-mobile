name: Lyrics WebKit integration
on:
  push:
    branches: ['feature/applemusic-lyrics']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run actual Apple WebKit integration
        run: |
          swiftc scripts/test-lyrics-webkit.swift -o /tmp/test-lyrics-webkit
          /tmp/test-lyrics-webkit src/components/lyrics/generated/lyrics.html /tmp/lyrics-webkit.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lyrics-webkit-evidence
          path: /tmp/lyrics-webkit.png
          if-no-files-found: ignore
